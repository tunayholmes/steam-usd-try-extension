<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">₺</div>
      <div class="headText">
        <div class="title">Steam USD → TL</div>
        <div class="subtitle">Fiyatları anında çevir</div>
      </div>
    </div>

    <div class="panel">
      <div class="panelTitle">Kur Ayarları</div>

      <div class="row">
        <div class="label">Kur modu</div>
        <select id="mode">
          <option value="auto">Otomatik</option>
          <option value="manual">Manuel</option>
        </select>
      </div>

      <div class="row" id="manualRow">
        <div class="label">Manuel kur</div>
        <input id="manualRate" type="number" step="0.01" />
      </div>

      <div class="rateCard">
        <div class="rateLeft">
          <div class="rateLabel">Aktif kur</div>
          <div class="rateValue" id="rateValue">—</div>
        </div>
        <div class="badge" id="rateBadge">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panelTitle">Görünüm</div>

      <div class="row">
        <div class="label">USD gizle</div>
        <label class="switch">
          <input id="hideUSD" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div class="label">TL format</div>
        <select id="tlFormat">
          <option value="rounded">Yuvarla</option>
          <option value="decimals">Küsüratlı</option>
        </select>
      </div>
    </div>

    <button id="save">Kaydet</button>

    <div class="footer" id="footerMsg"></div>

    <script src="popup.js"></script>
  </div>
</body>
</html>
